# The standalone downloads: Sourcerer with Python inside, for people without one.
#
#   Windows   Sourcerer-Windows.exe (installer) and Sourcerer-Windows.zip (portable)
#   macOS     Sourcerer-macOS-arm64.dmg and Sourcerer-macOS-x86_64.dmg
#   Linux     Sourcerer-Linux.AppImage and Sourcerer-Linux.tar.gz (portable)
#
# Built with PyInstaller, one runner per system (.github/exe/build.py), then each file is
# started the way a user starts it (.github/exe/smoke.py) before anything is published.
# They are the *second* kind of download beside Sourcerer.zip, not a replacement: that one
# stays the program itself (the launchers, a system Python, the in-app updater).
#
# Ways in -- only ever a Stable release gets files; GitHub's releases hold the Stable
# version and nothing else (Beta is the main branch, read by the updater):
#   - a release is published   -> the files are attached to it, next to Sourcerer.zip
#   - publish.yml made a release -> calls this for that tag (a release made with GITHUB_TOKEN
#                                 does not start the "published" run above)
#   - a pull request           -> built and tested, kept as workflow artifacts only
# Run it by hand (Actions > Build standalone Sourcerer > Run workflow) to rebuild the files
# for an existing release tag.
name: Build standalone Sourcerer

on:
  pull_request:
    paths:
      - ".github/exe/**"
      - ".github/workflows/build-exe.yml"
      - "Sourcerer_files/**"
  release:
    types: [published]
  workflow_call:
    inputs:
      ref:
        description: Tag to build, e.g. v0.18
        type: string
        required: true
      release:
        description: Release to attach the files to, e.g. v0.20
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to (re)build the files for, e.g. v0.20
        required: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false             # one system failing must not keep the others from publishing
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-22.04 }          # the oldest glibc on offer: runs on more systems
          - { name: macOS (Apple silicon), os: macos-latest }
          - { name: macOS (Intel), os: macos-15-intel }
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    concurrency:
      group: build-exe-${{ matrix.os }}-${{ inputs.release || inputs.tag || github.event.release.tag_name || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # Through the environment, never interpolated into a script. Empty on a pull request.
      RELEASE: ${{ inputs.release || inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.event.release.tag_name || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Sourcerer_files/requirements.txt

      - name: Install the packages Sourcerer needs, and PyInstaller
        run: python -m pip install -r Sourcerer_files/requirements.txt pyinstaller

      - name: Install Inno Setup (the Windows installer)
        if: runner.os == 'Windows'
        run: |
          if ! command -v iscc >/dev/null 2>&1 && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi

      - name: Build
        run: python .github/exe/build.py build-exe

      - name: Start every file the way a user does
        run: |
          for f in build-exe/assets/*; do
            echo "::group::$f"
            python .github/exe/smoke.py "$f" --window
            echo "::endgroup::"
          done

      - name: Keep the files as a workflow artifact (pull requests)
        if: ${{ env.RELEASE == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Sourcerer-${{ matrix.os }}
          path: build-exe/assets/*

      - name: Attach them to the release
        if: ${{ env.RELEASE != '' }}
        run: |
          gh release upload "$RELEASE" build-exe/assets/* --clobber
